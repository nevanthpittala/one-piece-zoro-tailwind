<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet"/>
  <title>One Piece - Zoro</title>
</head>
<body class="h-screen overflow-hidden bg-neutral-300">

    <main class="h-full py-4 px-10">

        <section
            class="h-full w-full rounded-3xl overflow-hidden grid grid-cols-[3fr_2fr]"
        >

            <!-- LEFT PANEL -->
            <article class="bg-green-500 flex flex-col relative">

                <!-- Logo -->
                <nav class="relative px-10 pt-4 z-10">
                    <a href="#">
                        <img
                            src="images/one-piece-logo.png"
                            alt="One Piece Logo"
                            class="h-[clamp(6rem,12vh,9rem)] w-auto"
                        >
                    </a>
                </nav>

                <!-- Content -->
                <div id="content" class="px-10 max-w-3xl mt-[clamp(2rem,5vh,4rem)] z-10 relative">
                    <p class="uppercase tracking-[0.4rem] font-bold text-[clamp(0.75rem,1vw,1rem)] font-[Inter]">STRAW HAT PIRATES</p>
                    <h1 class="text-[clamp(4rem,7vw,7rem)] font-black font-['Bebas_Neue'] leading-none mt-6 tracking-wider">Zoro</h1>
                    <p class="mt-8 font-[Inter] text-[clamp(1rem,1.5vw,1.4rem)] leading-relaxed max-w-xl">Roronoa Zoro, also known as "Pirate Hunter" Zoro, is the combatant of the Straw Hat Pirates. He is a master swordsman who fights using the unique Three Sword Style. His ultimate dream is to defeat Dracule Mihawk and become the world's greatest swordsman.</p>
                </div>
                <div class="absolute -bottom-30 -left-16 text-[22rem] opacity-[0.10] rotate-[30deg] z-0">
                      ⚔️
                  </div>

            </article>

            <!-- RIGHT PANEL -->
            <aside class="bg-green-50 flex flex-col relative">

                <!-- Menu -->
                <nav class="flex justify-end px-10 pt-8">
                    <button class="text-[clamp(1.75rem,3vw,2.5rem)] cursor-pointer">
                        <i class="ri-menu-line"></i>
                    </button>
                </nav>
                <!-- Image -->
                <div class="flex-1 relative">
                   <img src="images/zoro.png" alt=""
                  class="absolute bottom-[1%] left-[-28%] h-[110%] w-auto">
                </div>
                <div class="absolute right-10 top-1/2 -translate-y-1/2 flex flex-col gap-4">
                   <span class="w-3 h-3 rounded-full bg-green-300"></span>
                   <span class="w-3 h-3 rounded-full bg-black"></span>
                   <span class="w-3 h-3 rounded-full bg-green-300"></span>
                   <span class="w-3 h-3 rounded-full bg-green-300"></span>
                   <span class="w-3 h-3 rounded-full bg-green-300"></span>
               </div>

            </aside>

        </section>

    </main>

</body>
</html>
